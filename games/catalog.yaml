# Paths are filenames inside GAMES_DIR on the VPS, not downloads.
# The disc image and the PS1 BIOS are supplied by the operator.
games:
  - id: tekken3
    title: Tekken 3
    system: ps1
    players: 2
    enabled: true
    file: Tekken 3 (USA).cue
    ligaKey: tekken3
    ligaSlug: tekken-3
  - id: street-fighter-3
    title: Street Fighter 3
    system: ps1
    players: 2
    enabled: true
    file: Street Fighter Alpha 3 (USA).cue
    ligaKey: street-fighter-3
  - id: medal-of-honor
    title: Medal of Honor
    system: ps1
    players: 2
    enabled: true
    file: Medal of Honor (Europe).cue
    ligaKey: medal-of-honor
  - id: fifa-2002
    title: FIFA 2002
    system: ps1
    players: 2
    enabled: true
    file: FIFA Football 2002.cue
    ligaKey: fifa-2002
    ligaSlug: fifa-2002
  - id: pes-2002
    title: PES 2002
    system: ps1
    players: 2
    enabled: true
    file: Pro Evolution Soccer 2 (Europe) (Es,It).cue
    ligaKey: pes-2002
    ligaSlug: pes-2002
