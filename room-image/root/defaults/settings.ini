; Pad1 is SDL device 0 (Selkies player slot 1). Pad2 is SDL device 1 (slot 2).
; No Keyboard bindings, so a browser cannot drive both fighters from one pad.
; Sections are PadN — that is what current DuckStation reads.

[Main]
PauseOnFocusLoss = false
PauseOnControllerDisconnection = false
ConfirmPowerOff = false
DisableBackgroundInput = false
SaveStateOnExit = false
ApplyGameSettings = true
SettingsVersion = 3
SetupWizardIncomplete = false

[BIOS]
SearchDirectory = /bios

[GameList]
RecursivePaths = /games

[CPU]
ExecutionMode = Recompiler

[GPU]
Renderer = Software
ResolutionScale = 1

[Display]
AspectRatio = Stretch To Fill
Fullscreen = true
FullscreenMode = Desktop
VSync = false
ShowFPS = false
ShowOSDMessages = false
AutoResizeWindow = false
ExclusiveFullscreenControl = Allowed

[ControllerPorts]
MultitapMode = Disabled

[Pad1]
Type = AnalogController
ForceAnalogOnReset = true
AnalogDPadInDigitalMode = true
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LUp = SDL-0/-LeftY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RUp = SDL-0/-RightY
LargeMotor = SDL-0/LargeMotor
SmallMotor = SDL-0/SmallMotor

[Pad2]
Type = AnalogController
ForceAnalogOnReset = true
AnalogDPadInDigitalMode = true
Up = SDL-1/DPadUp
Right = SDL-1/DPadRight
Down = SDL-1/DPadDown
Left = SDL-1/DPadLeft
Triangle = SDL-1/Y
Circle = SDL-1/B
Cross = SDL-1/A
Square = SDL-1/X
Select = SDL-1/Back
Start = SDL-1/Start
L1 = SDL-1/LeftShoulder
R1 = SDL-1/RightShoulder
L2 = SDL-1/+LeftTrigger
R2 = SDL-1/+RightTrigger
L3 = SDL-1/LeftStick
R3 = SDL-1/RightStick
LLeft = SDL-1/-LeftX
LRight = SDL-1/+LeftX
LDown = SDL-1/+LeftY
LUp = SDL-1/-LeftY
RLeft = SDL-1/-RightX
RRight = SDL-1/+RightX
RDown = SDL-1/+RightY
RUp = SDL-1/-RightY
LargeMotor = SDL-1/LargeMotor
SmallMotor = SDL-1/SmallMotor

[Pad3]
Type = None

[Pad4]
Type = None
