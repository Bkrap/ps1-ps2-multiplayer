; Minimal PCSX2 2.x kiosk config for Selkies CPU rooms.
; Pad1 = SDL-0 (browser slot 1), Pad2 = SDL-1 (slot 2). Software renderer, 1x scale.

[UI]
SettingsVersion = 1
StartFullScreen = true
HideMouseCursor = true
ConfirmShutdown = false
SaveStateOnShutdown = false

[Folders]
; Overwritten at launch to a writable copy under ~/.config/PCSX2/bios
Bios = bios

[EmuCore]
EnableCheats = false
EnableWideScreenPatches = false
EnableNoInterlacingPatches = false
WarnAboutUnsafeSettings = false

[EmuCore/GS]
VsyncEnable = 0
Renderer = 13
upscale_multiplier = 1
MaxAnisotropy = 0
HWMipmap = false
AccurateBlendingUnit = 0

[EmuCore/Speedhacks]
EECycleRate = 0
EECycleSkip = 0
fastCDVD = false
IntcStat = true
WaitLoop = true
vuFlagHack = true
vuThread = false
vu1Instant = true

[InputSources]
Keyboard = false
Mouse = false
SDL = true
SDLControllerEnhancedMode = false

[Pad1]
Type = DualShock2
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LUp = SDL-0/-LeftY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RUp = SDL-0/-RightY
LargeMotor = SDL-0/LargeMotor
SmallMotor = SDL-0/SmallMotor

[Pad2]
Type = DualShock2
Up = SDL-1/DPadUp
Right = SDL-1/DPadRight
Down = SDL-1/DPadDown
Left = SDL-1/DPadLeft
Triangle = SDL-1/Y
Circle = SDL-1/B
Cross = SDL-1/A
Square = SDL-1/X
Select = SDL-1/Back
Start = SDL-1/Start
L1 = SDL-1/LeftShoulder
R1 = SDL-1/RightShoulder
L2 = SDL-1/+LeftTrigger
R2 = SDL-1/+RightTrigger
L3 = SDL-1/LeftStick
R3 = SDL-1/RightStick
LLeft = SDL-1/-LeftX
LRight = SDL-1/+LeftX
LDown = SDL-1/+LeftY
LUp = SDL-1/-LeftY
RLeft = SDL-1/-RightX
RRight = SDL-1/+RightX
RDown = SDL-1/+RightY
RUp = SDL-1/-RightY
LargeMotor = SDL-1/LargeMotor
SmallMotor = SDL-1/SmallMotor
